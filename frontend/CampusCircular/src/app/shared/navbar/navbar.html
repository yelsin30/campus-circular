<header class="navbar">
  <a class="brand" routerLink="/inicio" aria-label="Campus Circular, ir al inicio">
    <span class="brand-mark" aria-hidden="true"><span>C</span></span>
    <span>Campus Circular</span>
  </a>

  <nav class="nav-links" aria-label="Navegación principal">
    <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/publicar" routerLinkActive="active">Publicar</a>
    <a routerLink="/intercambios" routerLinkActive="active">Mis intercambios</a>
    <a routerLink="/impacto" routerLinkActive="active">Impacto</a>
    @if (isAdmin) {
      <a routerLink="/admin/reportes" routerLinkActive="active">Moderación</a>
    }
  </nav>

  <div class="account-actions">
    @if (auth.isAuthenticated()) {
      <span class="profile-link" [attr.title]="auth.currentUser()?.email || userDisplay">
        <span class="profile-avatar" aria-hidden="true">{{ userInitials }}</span>
        <span>{{ userDisplay }}</span>
      </span>
      <button class="logout-button" type="button" (click)="logout()">Salir</button>
    } @else {
      <a class="profile-link" routerLink="/login">
        <span class="profile-avatar" aria-hidden="true">{{ userInitials }}</span>
        <span>{{ userDisplay }}</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </a>
    }
  </div>
</header>
