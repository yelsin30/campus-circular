<header class="navbar">

    <span class="brand-mark" aria-hidden="true"><span>C</span></span>
    <span>Campus Circular</span>
  </a>

  <nav class="nav-links" aria-label="Navegación principal">
    <a routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/publicar" routerLinkActive="active">Publicar</a>

    <a class="profile-link" routerLink="/login">
