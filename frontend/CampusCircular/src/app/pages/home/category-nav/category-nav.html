<nav class="category-list" aria-label="Categorías de materiales">
  @for (category of categories; track category.label) {
    <button type="button" class="category-button" [class.selected]="selectedCategory === category.label" [attr.aria-pressed]="selectedCategory === category.label" (click)="categorySelected.emit(category.label)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @switch (category.icon) {
          @case ('all') { <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z" /><path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V21" /> }
          @case ('book') { <path d="M5 4.5h14v15H5z" /><path d="M8 7.5h8M8 10.5h8" /> }
          @case ('notes') { <path d="M6 3.5h9l4 4v13H6z" /><path d="M14.5 3.5v4h4M9 12h7M9 15h7" /> }
          @case ('equipment') { <path d="M4 5h16v11H4z" /><path d="M9 20h6m-3-4v4" /> }
          @case ('shield') { <path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z" /><path d="m9 12 2 2 4-4" /> }
          @case ('exchange') { <path d="M4 8h14l-3-3m5 11H6l3 3" /><path d="M18 8v-3M6 16v3" /> }
        }
      </svg>
      <span>{{ category.label }}</span>
    </button>
  }
</nav>
