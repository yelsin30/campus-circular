spring.application.name=campus-circular-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/campus_circular_db?allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=${DB_USERNAME:CC_G5}
spring.datasource.password=${DB_PASSWORD:2131}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__schema_inicial.sql
spring.sql.init.data-locations=classpath:db/migration/V2__seed_categorias.sql

JWT_SECRET=campus-circular-secreto-local-desarrollo-2026