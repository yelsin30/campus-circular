spring.application.name=campus-circular-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/campus_circular_db?allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=${DB_USERNAME:CC_G5}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

